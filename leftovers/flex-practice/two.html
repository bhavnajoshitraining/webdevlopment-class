<!DOCTYPE html>
<html>
<head>
    <title>Flexbox</title>

    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 300px;
            background-color: lightgray;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: steelblue;
            color: white;
            text-align: center;
            padding-top: 20px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

</body>
</html>
