<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Effects</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1 class="title">CSS Effects</h1>

    <div class="container">

        <div class="card">
            <h2>Box Shadow</h2>
            <p>This card has a shadow effect.</p>
        </div>

        <div class="card rounded">
            <h2>Border Radius</h2>
            <p>This card has rounded corners.</p>
        </div>

        <div class="card opacity">
            <h2>Opacity</h2>
            <p>This card has transparency.</p>
        </div>

        <div class="card filter">
            <h2>Filter</h2>
            <p>Hover over this card.</p>
        </div>

    </div>

</body>

</html>
