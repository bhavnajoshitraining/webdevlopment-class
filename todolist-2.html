<!-- This project combines arrays, objects, functions, 
 DOM manipulation, event listeners, JSON, Local Storage, and validation. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HashMatics Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 25px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 10px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        .task {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 12px;
            padding: 12px;
            background: #eef2ff;
        }

        .task span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My To-Do List</h1>

    <form id="taskForm">
        <input id="taskInput" placeholder="Enter a task">
        <button type="submit">Add</button>
    </form>

    <p id="error" class="error"></p>
    <div id="taskList"></div>
</div>

<script>
    let tasks = [];

    try {
        tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        if (!Array.isArray(tasks)) {
            tasks = [];
        }
    } catch (error) {
        tasks = [];
    }

    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");

    function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function displayTasks() {
        list.replaceChildren();

        tasks.forEach(function(task) {
            const row = document.createElement("div");
            row.className = "task";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;
            checkbox.dataset.action = "toggle";
            checkbox.dataset.id = task.id;

            const text = document.createElement("span");
            text.textContent = task.title;

            if (task.completed) {
                text.classList.add("completed");
            }

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.dataset.action = "delete";
            deleteButton.dataset.id = task.id;

            row.append(checkbox, text, deleteButton);
            list.appendChild(row);
        });
    }

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const title = input.value.trim();

        if (title === "") {
            document.getElementById("error").textContent =
                "Please enter a task.";
            return;
        }

        document.getElementById("error").textContent = "";

        tasks.unshift({
            id: Date.now() + Math.random(),
            title: title,
            completed: false
        });

        saveTasks();
        displayTasks();
        form.reset();
    });

    list.addEventListener("click", function(event) {
        if (event.target.dataset.action === "delete") {
            const id = Number(event.target.dataset.id);

            tasks = tasks.filter(function(task) {
                return task.id !== id;
            });

            saveTasks();
            displayTasks();
        }
    });

    list.addEventListener("change", function(event) {
        if (event.target.dataset.action === "toggle") {
            const id = Number(event.target.dataset.id);

            const task = tasks.find(function(item) {
                return item.id === id;
            });

            if (task) {
                task.completed = event.target.checked;
                saveTasks();
                displayTasks();
            }
        }
    });

    displayTasks();
</script>

</body>
</html>
